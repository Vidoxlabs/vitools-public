[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitools-sync"
version = "0.1.0"
description = "Emit Vidoxlabs canonical .agents/ artifacts to agent platforms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
vitools-sync = "vitools_sync.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vitools_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
