# Prettier configuration for Trunk.io
# Handles: JavaScript, TypeScript, JSON, Markdown, YAML, HTML, CSS

printWidth: 100
tabWidth: 2
useTabs: false
semi: true
singleQuote: true
trailingComma: es5
bracketSpacing: true
bracketSameLine: false
arrowParens: always
endOfLine: lf

# Markdown-specific
proseWrap: always
